name: Build

# Builds Justice Client for Windows, Linux and macOS (Apple Silicon + Intel, universal).
# Run it by hand from the Actions tab, or push a tag like v0.8.0. Builds are unsigned — macOS
# shows a Gatekeeper warning the first time (right-click → Open). Official signed releases still
# come from release.ps1; this is for macOS/CI builds and PR checks.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
            args: "--target universal-apple-darwin --bundles app,dmg"
          - os: windows-latest
            name: Windows
            args: "--bundles nsis"
          - os: ubuntu-22.04
            name: Linux
            args: "--bundles deb,appimage"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libappindicator3-dev libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS build targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        # bash on every OS (incl. Windows via Git Bash) so the inline --config JSON quoting is identical.
        shell: bash
        # Skip updater artifacts in CI: they need the private signing key, which never leaves the dev machine.
        run: npm run tauri build -- ${{ matrix.args }} --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-bundles
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.app" -o -name "*-setup.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-bundles/ \; || true
          ls -la dist-bundles || true

      - uses: actions/upload-artifact@v4
        with:
          name: justice-client-${{ matrix.os }}
          path: dist-bundles/*
          if-no-files-found: warn
