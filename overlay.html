<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>Justice Clips overlay</title>
    <style>
      :root {
        --red: #eb2634;
        --green: #2fd67b;
        --amber: #f5aa1e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: absolute;
        inset: 10px 10px auto 10px;
        height: 78px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px 0 16px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(24, 24, 30, 0.96), rgba(12, 12, 16, 0.96));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        overflow: hidden;
        opacity: 0;
        transform: translateX(60px) scale(0.96);
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 14px;
        bottom: 14px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent, var(--red));
        box-shadow: 0 0 14px var(--accent, var(--red));
      }
      .card.saved { --accent: var(--green); }
      .card.error { --accent: var(--amber); }
      .card.in {
        animation: in 0.5s cubic-bezier(0.2, 1.3, 0.35, 1) forwards;
      }
      .card.out {
        animation: out 0.3s cubic-bezier(0.5, 0, 0.9, 0.4) forwards;
      }
      .card.hidden { display: none; }
      @keyframes in {
        to { opacity: 1; transform: none; }
      }
      @keyframes out {
        from { opacity: 1; transform: none; }
        to { opacity: 0; transform: translateX(70px) scale(0.97); }
      }
      .icon {
        position: relative;
        width: 42px;
        height: 42px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent, var(--red)) 16%, transparent);
      }
      .icon svg { position: absolute; inset: 0; width: 42px; height: 42px; }
      .spin { display: none; animation: rot 0.9s linear infinite; }
      .spin circle { fill: none; stroke: var(--red); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 70 200; }
      .saving .spin { display: block; }
      .saving .dot { display: block; }
      .dot {
        display: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 10px var(--red);
        animation: pulse 0.9s ease-in-out infinite;
      }
      @keyframes rot { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { transform: scale(0.6); opacity: 0.6; } }
      .check, .cross { display: none; }
      .check path, .cross path {
        fill: none;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
      }
      .check path { stroke: var(--green); }
      .cross path { stroke: var(--amber); }
      .saved .check, .error .cross { display: block; }
      .saved .check path, .error .cross path { animation: draw 0.45s 0.12s cubic-bezier(0.6, 0, 0.3, 1) forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .saved .icon { animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
      @keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
      .txt { min-width: 0; }
      .title { color: #f2f2f6; font-weight: 650; font-size: 15px; letter-spacing: 0.1px; }
      .sub {
        color: #9a9aa8;
        font-size: 12.5px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 270px;
      }
      .brand {
        position: absolute;
        right: 14px;
        top: 10px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.6px;
        color: rgba(255, 255, 255, 0.22);
      }
      .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: var(--accent, var(--red));
        opacity: 0.7;
        transform-origin: left;
        transform: scaleX(0);
      }
      .saved .bar, .error .bar { animation: bar var(--life, 2.8s) linear forwards; transform: scaleX(1); }
      @keyframes bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
      .saving .bar { transform: scaleX(1); animation: indet 1.1s ease-in-out infinite; opacity: 0.5; }
      @keyframes indet { 0% { transform: translateX(-100%) scaleX(0.4); } 100% { transform: translateX(100%) scaleX(0.4); } }
    </style>
  </head>
  <body>
    <div id="card" class="card hidden">
      <div class="icon">
        <span class="dot"></span>
        <svg class="spin" viewBox="0 0 42 42"><circle cx="21" cy="21" r="19" /></svg>
        <svg class="check" viewBox="0 0 42 42"><path d="M13 21.5l5.5 5.5L29.5 15" /></svg>
        <svg class="cross" viewBox="0 0 42 42"><path d="M15 15l12 12M27 15L15 27" /></svg>
      </div>
      <div class="txt">
        <div class="title" id="t"></div>
        <div class="sub" id="s"></div>
      </div>
      <div class="brand">JUSTICE CLIPS</div>
      <div class="bar"></div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
